name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install scikit-learn numpy pydantic pydantic-settings pytest

      - name: Run signal tests
        run: |
          cd backend
          python -m pytest tests/test_signals.py::TestECS \
                           tests/test_signals.py::TestWhatsMissing \
                           tests/test_signals.py::TestSpecies \
                           tests/test_signals.py::TestECSSpecificity \
                           tests/test_signals.py::TestConfig \
                           tests/test_signals.py::TestDiffSurprise \
                           tests/test_signals.py::TestIntegration \
                           -v --tb=short

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://showreceipts.onrender.com