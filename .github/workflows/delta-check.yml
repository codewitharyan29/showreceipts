name: Δ DELTA — PR Quality Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  delta-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Analyze PR with DELTA
        id: delta
        run: |
          RESPONSE=$(curl -sf -X POST "${{ secrets.DELTA_API_URL }}/analyze" \
            -H "Content-Type: application/json" \
            -d "{\"pr_url\": \"${{ github.event.pull_request.html_url }}\"}" \
            || echo '{"delta_score": 0, "slop_label": "Unknown", "whats_missing": {"questions": []}, "sentences": [], "species": []}')

          SCORE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('delta_score', 0))" 2>/dev/null || echo "0")
          LABEL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('slop_label', 'Unknown'))" 2>/dev/null || echo "Unknown")

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const score = parseFloat('${{ steps.delta.outputs.score }}') || 0;
            const label = '${{ steps.delta.outputs.label }}';
            const emoji = score >= 76 ? '🟢' : score >= 51 ? '🟡' : score >= 26 ? '🟠' : '🔴';
            const body = `## ${emoji} Δ DELTA Score: ${score}/100 — ${label}\n\n> Zero LLM calls in detection path.\n\n[View full breakdown →](https://delicate-bonbon-50a0d5.netlify.app)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('DELTA Score') && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
